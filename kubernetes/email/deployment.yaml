apiVersion: apps/v1
kind: Deployment
metadata:
  name: email
spec:
  replicas: 1
  selector:
    matchLabels:
      app: email
  template:
    metadata:
      labels:
        app: email
    spec:
      serviceAccountName: astronomy-shop
      containers:
        - name: email
          image: ghcr.io/open-telemetry/demo:2.1.3-email
          ports:
            - containerPort: 6060
          env:
            - name: APP_ENV
              value: production
            - name: EMAIL_PORT
              value: "6060"
            - name: FLAGD_HOST
              value: flagd
            - name: FLAGD_PORT
              value: "8013"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4318
            - name: OTEL_SERVICE_NAME
              value: email
          resources:
            limits:
              memory: "100Mi"
