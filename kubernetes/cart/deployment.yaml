apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cart
  template:
    metadata:
      labels:
        app: cart
    spec:
      serviceAccountName: astronomy-shop
      containers:
        - name: cart
          image: ghcr.io/open-telemetry/demo:2.1.3-cart
          ports:
            - containerPort: 7070
          env:
            - name: CART_PORT
              value: "7070"
            - name: FLAGD_HOST
              value: flagd
            - name: FLAGD_PORT
              value: "8013"
            - name: VALKEY_ADDR
              value: valkey-cart:6379
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4317
            - name: OTEL_SERVICE_NAME
              value: cart
            - name: ASPNETCORE_URLS
              value: http://*:7070
          resources:
            limits:
              memory: "160Mi"
