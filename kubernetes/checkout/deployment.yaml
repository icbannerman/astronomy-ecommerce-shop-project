apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout
  template:
    metadata:
      labels:
        app: checkout
    spec:
      serviceAccountName: astronomy-shop
      containers:
        - name: checkout
          image: ghcr.io/open-telemetry/demo:2.1.3-checkout
          ports:
            - containerPort: 5050
          env:
            - name: FLAGD_HOST
              value: flagd
            - name: FLAGD_PORT
              value: "8013"
            - name: CHECKOUT_PORT
              value: "5050"
            - name: CART_ADDR
              value: cart:7070
            - name: CURRENCY_ADDR
              value: currency:7001
            - name: EMAIL_ADDR
              value: http://email:6060
            - name: PAYMENT_ADDR
              value: payment:50051
            - name: PRODUCT_CATALOG_ADDR
              value: product-catalog:3550
            - name: SHIPPING_ADDR
              value: http://shipping:50050
            - name: KAFKA_ADDR
              value: kafka:9092
            - name: GOMEMLIMIT
              value: 16MiB
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4317
            - name: OTEL_SERVICE_NAME
              value: checkout
          resources:
            limits:
              memory: "20Mi"
