apiVersion: apps/v1
kind: Deployment
metadata:
  name: flagd-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flagd-ui
  template:
    metadata:
      labels:
        app: flagd-ui
    spec:
      serviceAccountName: astronomy-shop
      containers:
        - name: flagd-ui
          image: ghcr.io/open-telemetry/demo:2.1.3-flagd-ui
          ports:
            - containerPort: 4000
          env:
            - name: FLAGD_UI_PORT
              value: "4000"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4318
            - name: OTEL_SERVICE_NAME
              value: flagd-ui
            - name: SECRET_KEY_BASE
              value: yYrECL4qbNwleYInGJYvVnSkwJuSQJ4ijPTx5tirGUXrbznFIBFVJdPl5t6O9ASw
            - name: PHX_HOST
              value: localhost
          resources:
            limits:
              memory: "200Mi"
          volumeMounts:
            - name: flagd-config
              mountPath: /app/data
      volumes:
        - name: flagd-config
          configMap:
            name: flagd-config
