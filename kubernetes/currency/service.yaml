apiVersion: v1    # fixed value for Services (different from Deployment's apps/v1)
kind: Service
metadata:
  name: currency  # becomes this Service's DNS name — other pods reach it as "currency:7001"
spec:
  selector:
    app: currency   # finds Pods carrying this label (set in the Deployment's template.metadata.labels)
  ports:
    - port: 7001          # port other Pods connect to, on the Service itself
      targetPort: 7001    # port forwarded to on the actual container — must match containerPort in the Deployment
