#CI for currency service
# Flow: pull request -> build only, to validate it compiles (no push to GHCR).
#       merge to main (a push) -> build, push the image, update the Kubernetes manifest.
#
# Unlike the other services, there's no separate "build" job here: compiling this C++ service
# outside Docker would need the same Alpine + gRPC + OpenTelemetry-C++ toolchain the Dockerfile
# already sets up, so the docker job's build step does double duty as the compile check.
# OpenTelemetry C++ compiles from source and is slow (30-60 min cold), so this job uses GitHub
# Actions cache for the Docker layers to keep repeat runs fast.
name: currency

concurrency:
  group: currency-deploy
  cancel-in-progress: false

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "src/currency/**"
      - "pb/**"
      - ".github/workflows/currency-ci.yaml"

jobs:
  # Builds the image on every PR and push (this is the compile check). Only pushes to GHCR
  # and only runs update-k8s when the event is an actual merge to main.
  build-and-push:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # Only needed when we're actually going to push; harmless to log in either way.
      - name: log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Build context is the repo root: the Dockerfile reads pb/demo.proto from outside src/currency/.
      - name: build (and push on main) image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/currency/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/icbannerman/currency:${{ github.run_id }}
          # Caches layers (including the slow OpenTelemetry C++ build) in GitHub's Actions cache.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-k8s:
    needs: build-and-push
    if: github.event_name == 'push'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: point deployment at new image
        run: |
          sed -i "s|image: ghcr.io/icbannerman/currency:.*|image: ghcr.io/icbannerman/currency:${{ github.run_id }}|" kubernetes/currency/deployment.yaml
      - name: commit and push manifest change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kubernetes/currency/deployment.yaml
          git commit -m "Update currency image to ${{ github.run_id }}"
          # Another service's update-k8s job may push to main between this job's checkout
          # and this push. Rebase onto the latest main so this push isn't rejected as stale.
          git pull --rebase origin main
          git push
