# One-off helper: reformats ad's Java source with google-java-format and commits the result.
# Not a real CI pipeline - manually triggered once, then deleted.
name: format-ad-oneoff

on:
  workflow_dispatch:

jobs:
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: reformat with google-java-format
        working-directory: src/ad
        run: ./gradlew googleJavaFormat --no-daemon
      - name: commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ad
          git diff --cached --quiet || git commit -m "Reformat ad source with google-java-format"
          git push
