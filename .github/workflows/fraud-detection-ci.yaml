#CI for fraud-detection service
# Flow: pull request -> checks only (build, test).
#       merge to main (a push) -> checks, then publish the image and update the Kubernetes manifest.
name: fraud-detection

concurrency:
  group: fraud-detection-deploy
  cancel-in-progress: false

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # pb/** because the build copies the shared proto in from the repo root (see below).
    paths:
      - "src/fraud-detection/**"
      - "pb/**"
      - ".github/workflows/fraud-detection-ci.yaml"

jobs:
  # Compiles and runs tests. No linter configured for this service (no ktlint etc.),
  # so unlike product-catalog there's no separate code-quality job.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      # Matches jvmTarget = JVM_17 in build.gradle.kts.
      - name: set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: set up Gradle
        uses: gradle/actions/setup-gradle@v4
      # Unlike ad, build.gradle.kts has no default protoSourceDir fallback: the Dockerfile
      # copies pb/ straight into src/main/proto/, so this step does the same here.
      - name: copy shared proto into source set
        run: |
          mkdir -p src/fraud-detection/src/main/proto
          cp pb/*.proto src/fraud-detection/src/main/proto/
      - name: Build and test fraud-detection
        working-directory: src/fraud-detection
        run: ./gradlew build --no-daemon

  docker:
    needs: build
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Build context is the repo root: the Dockerfile reads pb/ from outside src/fraud-detection/.
      - name: build and push image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/fraud-detection/Dockerfile
          push: true
          tags: ghcr.io/icbannerman/fraud-detection:${{ github.run_id }}

  update-k8s:
    needs: docker
    if: github.event_name == 'push'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: point deployment at new image
        run: |
          sed -i "s|image: ghcr.io/icbannerman/fraud-detection:.*|image: ghcr.io/icbannerman/fraud-detection:${{ github.run_id }}|" kubernetes/fraud-detection/deployment.yaml
      - name: commit and push manifest change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kubernetes/fraud-detection/deployment.yaml
          git commit -m "Update fraud-detection image to ${{ github.run_id }}"
          git push
